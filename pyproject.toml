[project]
name = "daisy-cotton"
version = "0.0.1"
description = "Base daisyUI-styled django-cotton components: buttons, inputs, cards, alerts and the rest of an application's furniture"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# The host supplies daisyUI and its active theme, by whatever means it likes.
# This package renders daisyUI markup, so the only code dependency is Cotton
# itself.
dependencies = ["django>=5.2", "django-cotton>=2.6"]
keywords = ["django", "tailwind", "daisyui", "components", "cotton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/SamuelJennings/daisy-cotton"
Repository = "https://github.com/SamuelJennings/daisy-cotton"
Issues = "https://github.com/SamuelJennings/daisy-cotton/issues"

[dependency-groups]
# Toolchain bundle; the tag in [tool.uv.sources] is the shared version. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
dev = [
    "mvp-shared[dev,test]",
    # Dev-only: serves component source, and its URLs mount under DEBUG only.
    "django-cotton-gallery>=1.0.0,<2",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daisy_cotton"]

[tool.hatch.build.targets.sdist]
include = ["/daisy_cotton", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    # tests/settings.py installs the gallery directly, so silence its
    # "mounted and serving" notice.
    "ignore:(?s).*django-cotton-gallery is MOUNTED AND SERVING.*:RuntimeWarning",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["daisy_cotton"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# ruff-base.toml is copied in, not referenced remotely: `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The demo project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"demo/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["daisy_cotton"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "daisy_cotton/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.forge.conformance]
# These tests exercise Cotton templates or the app registry, so there is no Python module to mirror.
non-mirror-paths = [
    "tests/test_app.py",
    "tests/test_render_all.py",
    "tests/test_declared_attributes.py",
    "tests/test_class_attribute_merge.py",
    "tests/test_button.py",
    "tests/test_dropdown.py",
    "tests/test_card.py",
    "tests/test_table.py",
    "tests/test_badge.py",
    "tests/test_content_display_no_script.py",
    "tests/test_animated_display_no_script.py",
    "tests/test_carousel.py",
    "tests/test_chat.py",
    "tests/test_diff.py",
    "tests/test_hover_gallery.py",
    "tests/test_hover_3d.py",
    "tests/test_text_rotate.py",
    "tests/test_countdown.py",
    "tests/test_icon.py",
    "tests/test_link.py",
    "tests/test_divider.py",
    "tests/test_join.py",
    "tests/test_footer.py",
    "tests/test_drawer.py",
    "tests/test_indicator.py",
    "tests/test_hero.py",
    "tests/test_mask_stack.py",
    "tests/test_mockup.py",
    "tests/test_mockup_code.py",
    "tests/test_modal.py",
    "tests/test_collapse.py",
    "tests/test_avatar.py",
    "tests/test_stat.py",
    "tests/test_list.py",
    "tests/test_timeline.py",
    "tests/test_kbd.py",
    "tests/test_status.py",
    "tests/test_swap.py",
    "tests/test_fab.py",
    "tests/test_breadcrumbs_href_attribute.py",
    "tests/test_dock.py",
    "tests/test_menu.py",
    "tests/test_navbar.py",
    "tests/test_tabs.py",
    "tests/test_steps.py",
    "tests/test_megamenu.py",
    "tests/test_form_field.py",
    "tests/test_alert.py",
    "tests/test_loading.py",
    "tests/test_tooltip.py",
    "tests/test_progress.py",
    "tests/test_radial_progress.py",
    "tests/test_toast.py",
    "tests/test_skeleton.py",
    "tests/test_feedback_no_script.py",
    "tests/test_input.py",
    "tests/test_label.py",
    "tests/test_fieldset.py",
    "tests/test_form_controls.py",
    "tests/test_gallery_annotations.py",
    "tests/test_gallery_lint.py",
    # Exercises the demo project's own URLs and settings, not a component
    # template or a Python module in the package.
    "tests/test_demo.py",
    # Walks the rendered gallery sidebar; there is no source module for a
    # test parametrised from another package's runtime output to mirror.
    "tests/test_gallery_links.py",
    # Reads every component template for literal colours (Article XII).
    "tests/test_semantic_palette.py",
    # Reads the source of the navigation templates for scripts; there is no
    # Python module to mirror.
    "tests/test_navigation_markup.py",
]

[tool.deptry]
extend_exclude = ["tests/", "demo/", "docs/"]

[tool.deptry.per_rule_ignores]
# Cotton is a runtime dependency that no module imports: without it, <c-…> tags render as literal text.
DEP002 = ["django-cotton"]
