{% comment %}
  The gallery loads this partial as the whole <head> of every preview and
  raw document, so daisyUI, Tailwind, Alpine and the icon font are injected
  only there and skipped in the interface page itself (#95).
{% endcomment %}
<script>
  (() => {
    const isPreviewDocument = window.top !== window
      || /\/(raw|preview|thumb)\/$/.test(window.location.pathname);
    if (!isPreviewDocument) return;

    document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5">');
    document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css">');
    document.write('<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></' + 'script>');
    document.write('<script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></' + 'script>');
    // An icon font for trying out icon attributes: type a class such as
    // `bi bi-house` into any icon field. The package itself resolves no icons.
    document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css">');

    let theme = 'light';
    try {
      theme = localStorage.getItem('daisy-cotton-theme') || 'light';
    } catch (_) { /* storage disabled */ }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
