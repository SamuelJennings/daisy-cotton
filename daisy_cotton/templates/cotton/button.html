{# @description A button, or a link styled as one when an href is passed. Shows an optional icon and text, then the default slot. #}
{# @prop href:text | description:"When given, the button renders as a link with this href instead of a <button>." #}
{# @prop disabled:boolean | description:"Disable the button. On a link this adds btn-disabled, aria-disabled, role=button and tabindex=-1 instead of the native attribute." #}
{# @prop text:text | description:"Button label, shown in a span after the icon and before the default slot." #}
{# @prop icon:text | description:"Icon shown before the text, passed as the name of the icon component." #}
{# @prop variant:select['neutral','primary','secondary','accent','info','success','warning','error'] | description:"Colour variant. Leave empty for the default colour." #}
{# @prop size:select['xs','sm','md','lg','xl'] | description:"Button size." #}
{# @prop outline:boolean | description:"Draw the button as an outline." #}
{# @prop dash:boolean | description:"Draw the button with a dashed outline." #}
{# @prop soft:boolean | description:"Draw the button with a soft, tinted background." #}
{# @prop ghost:boolean | description:"Draw the button with no background until hovered." #}
{# @prop link:boolean | description:"Draw the button styled as a plain link." #}
{# @prop active:boolean | description:"Force the button's active (pressed) state." #}
{# @prop wide:boolean | description:"Widen the button." #}
{# @prop block:boolean | description:"Stretch the button to the full width of its container." #}
{# @prop square:boolean | description:"Make the button a fixed-size square, for a single icon." #}
{# @prop circle:boolean | description:"Make the button a fixed-size circle, for a single icon." #}
{# @prop class:text | description:"Extra classes added to the button." #}
{# @slot — Content shown after the icon and text. #}
{% load daisy_cotton %}
<c-vars href=""
        text=""
        icon=""
        variant=""
        size=""
        outline=""
        dash=""
        soft=""
        ghost=""
        link=""
        active=""
        disabled=""
        wide=""
        block=""
        square=""
        circle=""
        class="" />
{# djlint:off #}
{% if href %}<a href="{{ href }}" class="btn {% variation variant "btn" "neutral,primary,secondary,accent,info,success,warning,error" %} {% variation size "btn" "xs,sm,md,lg,xl" %}{% if outline %} btn-outline{% endif %}{% if dash %} btn-dash{% endif %}{% if soft %} btn-soft{% endif %}{% if ghost %} btn-ghost{% endif %}{% if link %} btn-link{% endif %}{% if active %} btn-active{% endif %}{% if wide %} btn-wide{% endif %}{% if block %} btn-block{% endif %}{% if square %} btn-square{% endif %}{% if circle %} btn-circle{% endif %}{% if disabled %} btn-disabled{% endif %} {{ class }}"{% if disabled %} aria-disabled="true" role="button" tabindex="-1"{% endif %} {{ attrs }}>
  {% if icon %}<c-icon name="{{ icon }}" aria-hidden="true" />{% endif %}
  {% if text %}<span>{{ text }}</span>{% endif %}
  {{ slot }}
</a>
{% else %}<button class="btn {% variation variant "btn" "neutral,primary,secondary,accent,info,success,warning,error" %} {% variation size "btn" "xs,sm,md,lg,xl" %}{% if outline %} btn-outline{% endif %}{% if dash %} btn-dash{% endif %}{% if soft %} btn-soft{% endif %}{% if ghost %} btn-ghost{% endif %}{% if link %} btn-link{% endif %}{% if active %} btn-active{% endif %}{% if wide %} btn-wide{% endif %}{% if block %} btn-block{% endif %}{% if square %} btn-square{% endif %}{% if circle %} btn-circle{% endif %} {{ class }}"{% if disabled %} disabled{% endif %} {{ attrs }}>
  {% if icon %}<c-icon name="{{ icon }}" aria-hidden="true" />{% endif %}
  {% if text %}<span>{{ text }}</span>{% endif %}
  {{ slot }}
</button>
{% endif %}
{# djlint:on #}
