{# @description A phone frame with a camera notch, for showing a mobile screen. #}
{# @prop class:text | description:"Extra classes added to the phone frame." #}
{# @slot — The content shown on the phone's display. #}
<c-vars class />
<div class="mockup-phone {{ class }}" {{ attrs }}>
  <div class="mockup-phone-camera" aria-hidden="true"></div>
  <div class="mockup-phone-display bg-base-100 text-base-content">{{ slot }}</div>
</div>
